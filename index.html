<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VPN — подключение на iPhone</title>
<style>
:root{
  --ink:#050507;
  --ti-hi:#c4bfb6;
  --ti-mid:#76716a;
  --ti-lo:#2b2a28;
  --glass:#000;
  --tg-bg:#0f0f10;
  --tg-bar:#212121;
  --tg-bub:#212121;
  --tg-btn:rgba(38,38,40,.96);
  --code:#8fa8ff;
  --g:#3ddc97;
  --g-soft:#7fe0b8;
  --txt:#f4f5f7;
  --muted:#8b97a4;
  --ui:-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--txt);font-family:var(--ui);color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}

#wrap{position:relative;overflow:hidden;border-radius:14px;background:#000;box-shadow:0 0 0 1px #1b1b20}
#stage{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0;overflow:hidden;
  background:radial-gradient(110% 60% at 50% 70%,#161a28 0%,#0a0b11 55%,#030304 100%)}
#stage::before{content:"";position:absolute;left:-20%;right:-20%;top:62%;bottom:-10%;
  background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.035) 40%,rgba(255,255,255,.08) 100%);
  transform:perspective(500px) rotateX(55deg);transform-origin:top;opacity:0;transition:opacity 2s}
#stage.floor::before{opacity:1}
.orb{position:absolute;border-radius:50%;filter:blur(55px);pointer-events:none;opacity:.55}
.o1{width:230px;height:230px;left:-80px;top:250px;background:#0d6a4b;animation:drift 15s ease-in-out infinite alternate}
.o2{width:210px;height:210px;right:-80px;top:390px;background:#2a3c98;animation:drift 18s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(40px,-50px)}}

/* explanation panel */
#info{position:absolute;left:20px;right:20px;top:18px;z-index:30;pointer-events:none;transition:opacity .35s,transform .35s}
#info.swap{opacity:0;transform:translateY(6px)}
#segs{display:flex;gap:4px;margin-bottom:11px}
#segs i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.12);transition:background .5s}
#segs i.on{background:var(--g)}
#ititle{font-size:17px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
#ibody{margin-top:6px;font-size:11.5px;line-height:1.45;color:#b4bccb;max-width:320px}
#recap{display:none;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:11px}
#recap span{font-size:9.5px;font-weight:600;padding:3px 8px;border-radius:10px;background:rgba(61,220,151,.12);border:1px solid rgba(61,220,151,.35);color:#9af0c8}
#info.final{top:24px;text-align:center}
#info.final #segs{display:none}
#info.final #ititle{font-size:21px;line-height:1.25}
#info.final #ibody{margin-left:auto;margin-right:auto;font-size:12px}
#info.final #recap{display:flex}
#info.hidden{opacity:0}

#rig{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-origin:50% 50%}
#phone{position:relative;width:250px;height:520px;border-radius:46px;padding:5px;
  background:linear-gradient(135deg,var(--ti-hi) 0%,var(--ti-mid) 22%,var(--ti-lo) 45%,var(--ti-mid) 70%,var(--ti-hi) 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.22) inset,0 0 0 2px #0a0a0a inset,0 30px 70px rgba(0,0,0,.7),0 0 120px rgba(120,150,220,.08);
  opacity:0;transform:translateY(26px) scale(.96);transition:opacity 1.2s ease,transform 1.6s cubic-bezier(.2,.7,.2,1)}
#phone.in{opacity:1;transform:none}
#phone::before,#phone::after{content:"";position:absolute;width:3px;background:linear-gradient(180deg,var(--ti-hi),var(--ti-lo));border-radius:2px}
#phone::before{left:-3px;top:110px;height:54px}
#phone::after{right:-3px;top:140px;height:76px}
#phone.gloss{-webkit-box-reflect:below 6px linear-gradient(transparent 62%,rgba(255,255,255,.16))}

/* screen: black bezel inside titanium, concentric radius */
#screen{position:relative;width:100%;height:100%;border-radius:41px;overflow:hidden;background:#000;isolation:isolate;box-shadow:0 0 0 2px #000}
/* Dynamic Island */
#island{position:absolute;top:10px;left:50%;width:78px;height:23px;margin-left:-39px;border-radius:12px;background:#000;z-index:60}
#island::before{content:"";position:absolute;right:9px;top:6.5px;width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle at 36% 34%,#2c3a5c 0,#0d1224 42%,#000 72%);box-shadow:0 0 0 1px rgba(255,255,255,.04)}
#island::after{content:"";position:absolute;left:12px;top:9px;width:5px;height:5px;border-radius:50%;background:radial-gradient(circle,#161a26,#000 70%)}
#status{position:absolute;top:0;left:0;right:0;height:43px;z-index:55;display:flex;justify-content:space-between;align-items:center;padding:0 26px 0 30px;font-size:11.5px;font-weight:600;letter-spacing:-.01em;pointer-events:none}
#status .r{display:flex;align-items:center;gap:5px}
#vpnbadge{font-size:8px;font-weight:700;padding:1px 5px;border-radius:7px;background:#fff;color:#000;opacity:0;transform:scale(.7);transition:all .5s}
#vpnbadge.on{opacity:1;transform:none}
#homebar{position:absolute;bottom:6px;left:50%;width:84px;height:3px;margin-left:-42px;background:#fff;border-radius:2px;opacity:.85;z-index:60}
#glare{position:absolute;inset:0;z-index:70;pointer-events:none;border-radius:41px;background:linear-gradient(115deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 28%)}

.app{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .5s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.app.on{opacity:1}

/* home + mountains wallpaper */
#home{transform:none;padding:68px 18px 0}
#home.off{transform:scale(1.15);opacity:0}
#home .wall{position:absolute;inset:0;width:100%;height:100%}
.grid{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px}
.ico{aspect-ratio:1;border-radius:13px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
.ico.tg{background:linear-gradient(180deg,#37aee2,#1e96c8)}
.ico.a{background:linear-gradient(160deg,rgba(80,84,120,.7),rgba(40,42,70,.7))}
.ico.b{background:linear-gradient(160deg,rgba(110,80,100,.7),rgba(60,40,60,.7))}
.ico.c{background:linear-gradient(160deg,rgba(70,100,110,.7),rgba(30,52,62,.7))}

/* telegram */
#tg{background:var(--tg-bg);transform:scale(.92);padding-top:44px;display:flex;flex-direction:column}
#tg.on{transform:none}
.tghead{height:44px;background:var(--tg-bar);display:flex;align-items:center;gap:8px;padding:0 12px;flex:none;border-bottom:1px solid #000}
.tghead .back{color:#8aa4c8;font-size:20px;line-height:1}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#3ddc97,#1a8f68);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#04170f}
.tghead .nm{font-size:12px;font-weight:600;line-height:1.15}
.tghead .st{font-size:9px;color:var(--muted)}
#msgs{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;padding:8px 7px;overflow:hidden;
  background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.2px);background-size:13px 13px}
.m{max-width:95%;opacity:0;transform:translateY(8px);transition:all .4s cubic-bezier(.2,.7,.2,1)}
.m.in{opacity:1;transform:none}
.m.me{align-self:flex-end}
.m.bot{align-self:flex-start;width:95%}
.b{position:relative;padding:6px 34px 6px 8px;border-radius:11px;font-size:10.2px;line-height:1.34;background:var(--tg-bub)}
.me .b{background:#2b5278;border-bottom-right-radius:4px;width:fit-content;margin-left:auto;font-size:11px}
.bot .b{border-bottom-left-radius:4px}
.b .sp{height:5px}
.b code{font-family:ui-monospace,Consolas,monospace;color:var(--code);background:rgba(255,255,255,.06);padding:0 3px;border-radius:3px;font-size:9.4px}
.b code.url{display:block;margin-top:2px;padding:3px 5px;border-left:2px solid #e8833a;font-size:8.4px;word-break:break-all}
.tm{position:absolute;right:7px;bottom:3px;font-size:7.5px;color:rgba(255,255,255,.4)}
.kb{margin-top:3px;display:flex;flex-direction:column;gap:3px}
.kbtn{position:relative;font-size:10.2px;font-weight:600;color:#fff;background:var(--tg-btn);padding:6px 8px;border-radius:7px;text-align:center;transition:filter .12s,transform .12s}
.kbtn.ext::after{content:"↗";position:absolute;right:5px;top:1px;font-size:8px;opacity:.7}
.pressed{filter:brightness(1.7);transform:scale(.97)}
.hl{outline:2px solid rgba(255,255,255,.95);outline-offset:2px;animation:hl 1s ease-in-out infinite}
@keyframes hl{0%,100%{box-shadow:0 0 0 3px rgba(61,220,151,.15)}50%{box-shadow:0 0 0 7px rgba(61,220,151,.38)}}
.dots{display:flex;gap:3px;padding:3px 0}
.dots i{width:5px;height:5px;border-radius:50%;background:#8fa3b8;animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-2px)}}
.tginput{flex:none;height:44px;background:var(--tg-bar);display:flex;align-items:center;gap:8px;padding:0 10px 8px}
#inp{flex:1;height:26px;border-radius:13px;background:#0f0f10;padding:0 11px;display:flex;align-items:center;font-size:11px;white-space:nowrap;overflow:hidden}
#inp:empty::before{content:"Сообщение";color:#5b6874}
.send{width:26px;height:26px;border-radius:50%;background:#4a90e2;display:flex;align-items:center;justify-content:center;opacity:.35;transition:opacity .2s}
.send.act{opacity:1}

/* web page sheet (in Telegram) */
#install{top:48px;border-radius:16px 16px 0 0;background:#05070d;transform:translateY(60px);overflow:hidden;box-shadow:0 -10px 30px rgba(0,0,0,.5)}
#install.on{transform:none}
.sheet-bar{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:10px;font-weight:600;background:#0c0f18;border-bottom:1px solid #151a28;position:relative;z-index:3}
.sheet-bar span{color:#8895ab;font-weight:500}
#pg{position:relative;padding:10px 10px 30px;transition:transform 1.2s cubic-bezier(.45,.05,.2,1)}
.phead{display:flex;align-items:center;justify-content:space-between;border:1px solid #171d2d;border-radius:12px;background:#080b14;padding:9px 10px;margin-bottom:10px}
.phead b{display:block;font-size:13px;letter-spacing:.01em}
.phead span.sub{display:block;margin-top:2px;font-size:6.5px;letter-spacing:.14em;color:#6c7893}
.pbtns{display:flex;gap:4px}
.pb{width:24px;height:22px;border-radius:7px;border:1px solid #232b40;background:#0b0f1a;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;font-style:normal;color:#dfe5f2}
.pb.w{width:28px}
.card{border:1px solid #1a2132;border-radius:14px;background:linear-gradient(180deg,#0d1220,#090d18);padding:10px;margin-bottom:10px}
.lab{font-size:7.5px;letter-spacing:.09em;color:#6c7893;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:5px;margin-top:6px}
.tile{border:1px solid #1b2234;border-radius:8px;padding:6px 6px;background:#0a0e19}
.tile.ok{border-color:#1d6b52;background:#0b2a22}
.tile b{display:block;margin-top:3px;font-size:9px}
.tile.ok b{color:#6df0b8}
.idbox{margin-top:8px;border:1px solid #1b2234;border-radius:9px;padding:8px;background:#05070d;text-align:center}
.idbox b{display:block;margin-top:2px;font-size:22px;letter-spacing:.04em;font-family:ui-monospace,Consolas,monospace}
.pgh{display:flex;justify-content:space-between;align-items:center;position:relative}
.pgh b{font-size:12px}
.pill{font-size:8.5px;font-weight:600;border:1px solid #2a3350;border-radius:9px;padding:4px 9px;color:#e6ebf7;background:#0a0e19;transition:filter .12s,transform .12s}
.dd{display:none;position:absolute;right:0;top:27px;width:112px;z-index:6;border:1px solid #2a3350;border-radius:11px;background:#0b0f1a;padding:4px;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.dd.on{display:block;animation:vin .25s ease both}
.dd div{display:flex;align-items:center;justify-content:space-between;font-size:8.5px;color:#aab3c6;padding:5px 7px;border-radius:7px}
.dd div.sep{height:1px;padding:0;margin:3px 4px;background:#1c2338}
.dd div.cur{color:#fff;font-weight:700}
.dd div.cur::after{content:"✓";color:#3dd6c6}
.chips{display:grid;grid-template-columns:1.1fr 1fr;gap:5px;margin:9px 0 10px}
.chip{border:1px solid #1b2234;border-radius:10px;padding:6px 7px;display:flex;align-items:center;gap:6px;background:#0a0e19}
.chip.on{border-color:#1f7a57;background:linear-gradient(90deg,#0b2a22,#0a1a18)}
.chip .mini{width:20px;height:20px;border-radius:5px;background:#0b1a14;border:1px solid #1f6b4a;color:#3dff9a;font-size:5.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.chip.h .mini{background:linear-gradient(135deg,#3a7bff,#2358d6);border-color:#3a7bff;color:#fff;font-size:9px}
.chip b{display:block;font-size:9px}
.chip span{font-size:6.5px;color:#7f8aa3}
.stp{position:relative;display:flex;gap:8px;padding-bottom:10px}
.stp .n{width:18px;height:18px;border-radius:50%;flex:none;border:1px solid #3a3470;background:#171436;color:#b6a8ff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.stp .n.d{border-color:#1f7a57;background:#0b2a22;color:#6df0b8}
.stp h4{font-size:10px;margin-bottom:2px}
.stp p{font-size:8px;line-height:1.4;color:#7f8aa3}
.sbtn{display:inline-flex;align-items:center;gap:5px;margin-top:6px;border:1px solid #2a3350;border-radius:8px;background:#05070d;padding:5px 9px;font-size:8px;color:#cdd5e5;transition:filter .12s,transform .12s}
.sbtn b{display:block;font-size:10px;color:#fff;line-height:1}
.sbtn small{display:block;font-size:5.5px;letter-spacing:.06em;color:#8895ab;margin-bottom:1px}
.gbtn{display:inline-block;margin-top:6px;border-radius:9px;padding:7px 14px;font-size:9.5px;font-weight:700;color:#fff;background:linear-gradient(90deg,#26b8e6,#8a6df0);box-shadow:0 4px 16px rgba(110,110,255,.4);transition:filter .12s,transform .12s}

/* app store sheet */
#asheet{position:absolute;left:0;right:0;bottom:0;z-index:48;border-radius:18px 18px 0 0;background:rgba(36,36,40,.96);backdrop-filter:blur(20px);padding:14px 14px 28px;transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.7,.2,1);box-shadow:0 -10px 30px rgba(0,0,0,.5)}
#asheet.on{transform:none}
#asheet .rw{display:flex;align-items:center;gap:10px}
.aico{width:44px;height:44px;border-radius:11px;flex:none;background:#0b1a14;border:1px solid #1f6b4a;color:#3dff9a;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;letter-spacing:.03em;box-shadow:0 4px 14px rgba(40,200,130,.25)}
#asheet b{font-size:13px;display:block}
#asheet span{font-size:9px;color:var(--muted)}
.getbtn{margin-left:auto;min-width:56px;height:26px;border-radius:13px;background:#3a3a40;color:#5ab0ff;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;transition:filter .12s,transform .12s}
.ring{stroke-dasharray:63;stroke-dashoffset:63;transition:stroke-dashoffset 2.2s linear}
.ring.go{stroke-dashoffset:4}

/* INCY */
#incy{background:radial-gradient(120% 45% at 50% 0%,#0f2a22 0%,#08130f 60%,#060d0b 100%);transform:scale(.7);overflow:hidden}
#incy.on{transform:none}
#itop{position:absolute;top:0;left:0;right:0;height:46px;z-index:4;background:linear-gradient(#0a1a14 72%,rgba(10,26,20,0));pointer-events:none}
#iscroll{position:absolute;left:10px;right:10px;top:48px;transition:transform .55s cubic-bezier(.4,.1,.2,1)}
.itabs{display:flex;justify-content:center;gap:6px}
.tab{font-size:8.5px;font-weight:700;padding:3px 9px;border-radius:8px;border:1px solid #2a4a3d;color:#9fd8c0}
.tab.on{background:#0d3a2b;border-color:#2f8a67;color:#7fe0b8}
#pwr{margin:12px auto 7px;width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#10261d,#0a1713);border:1px solid #1d3d31;transition:all .5s;position:relative}
#pwr svg{stroke:var(--g-soft);transition:stroke .5s}
#pwr.busy{border-color:#f0b24a;animation:pulse 1.1s infinite}
#pwr.busy svg{stroke:#f0b24a}
#pwr.live{border-color:var(--g);background:radial-gradient(circle,#14513a,#0d2a20);box-shadow:0 0 34px rgba(61,220,151,.5)}
#pwr.live svg{stroke:#b6ffdd}
@keyframes pulse{50%{box-shadow:0 0 22px rgba(240,178,74,.5)}}
#pst{text-align:center;font-size:10px;color:#87b8a4;transition:color .4s;margin-bottom:9px}
#pst.live{color:var(--g);font-weight:700}
.note{border:1px solid #4a4020;border-radius:9px;background:rgba(80,64,20,.18);padding:6px 8px;font-size:7.4px;line-height:1.4;color:#d8cfa6;margin-bottom:8px}
.irow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.ibtn{text-align:center;font-size:9px;font-weight:600;padding:7px 0;border-radius:9px;background:#0c1f18;border:1px solid #17352a;color:#cfeee0}
.ilab{font-size:7.5px;letter-spacing:.08em;color:#6fa08c;margin:0 2px 5px}
.icard{border:1px solid #15332a;border-radius:12px;background:#09150f;padding:7px}
.ihd{display:flex;align-items:center;gap:5px;margin-bottom:6px}
.ihd .star{width:22px;height:22px;border-radius:7px;background:#1c2a1d;border:1px solid #3a4a2a;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;color:#e5c97a}
.ihd .hn{flex:1;min-width:0}
.ihd .hn b{display:block;font-size:9.5px;color:#e5c97a}
.ihd .hn small{font-size:6.5px;color:#7fa090}
.cnt{font-size:7.5px;font-weight:700;color:#9af0c8;background:#0f3326;border-radius:8px;padding:2px 6px}
.ic{width:20px;height:20px;border-radius:7px;border:1px solid #1f4a38;background:#0c1f18;display:flex;align-items:center;justify-content:center;font-size:9px;color:#9fd8c0;transition:filter .12s,transform .12s}
#ld{height:150px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:9.5px;color:#9fd8c0}
#ld i{width:12px;height:12px;border-radius:50%;border:2px solid #1f4a38;border-top-color:var(--g);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#rows{display:none;flex-direction:column;gap:3px}
#rows.on{display:flex;animation:vin .5s ease both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.srv{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:9px;border:1px solid transparent;transition:all .35s}
.srv.sel{border-color:#2f8a67;background:#10261d}
.srv.best:not(.sel){border-color:#3a7a5a;background:#0c2219}
.srv .t{flex:1;min-width:0}
.srv .t b{display:block;font-size:9px;font-weight:600}
.srv .t span{font-size:6.5px;color:#c9c04a}
.srv .p{font-size:7.5px;color:#cdd5e5;display:flex;align-items:center;gap:3px;min-width:46px;justify-content:flex-end}
.srv .dot{width:5px;height:5px;border-radius:50%;background:#4a5a52}
.srv .dot.y{background:#e8c93a}
.srv .dot.g{background:#35d07f}
.srv.testing .v{animation:blink .7s infinite}
@keyframes blink{50%{opacity:.25}}
.srv .bt{display:none;font-style:normal;font-size:6.5px;font-weight:800;color:#04170f;background:var(--g);border-radius:6px;padding:1px 5px;margin-right:3px}
.srv.best .bt{display:inline-block}
.fl{width:16px;height:16px;border-radius:50%;flex:none;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:8px;color:#ffd23f;font-style:normal}
.fl.eu{background:#1a47b8}
.fl.ch{background:#d52b1e}

  return {L:(r.left-sr.left)/k,T:(r.top-sr.top)/k,W:r.width/k,H:r.height/k};
}

  tip.classList.remove('on','up','down');
  tip.textContent=label;
  tip.style.left='0px';tip.style.top='0px';
  const w=tip.offsetWidth,h=tip.offsetHeight,sw=screenEl.offsetWidth;
  const cx=g.L+g.W/2;
  const left=Math.min(Math.max(cx-w/2,8),sw-8-w);
  const up=g.T>96;
  const top=up?g.T-h-10:g.T+g.H+10;
  tip.classList.add(up?'up':'down');
  tip.style.left=left+'px';tip.style.top=top+'px';
  tip.style.setProperty('--ax',Math.min(Math.max(cx-left,10),w-10)+'px');
  requestAnimationFrame(()=>tip.classList.add('on'));
}
async function tap(el,label){
  const f=$('#finger'),tip=$('#tip');
  el.classList.add('hl');
  const g=geo(el);
  placeTip(el,label||'Нажмите');
  f.style.opacity=1;f.style.left=(g.L+g.W/2)+'px';f.style.top=(g.T+g.H/2)+'px';
  await after(.9);
  f.classList.add('press');el.classList.add('pressed');
  tip.classList.remove('on');
  await after(.2);
  f.classList.remove('press');
  await after(.12);
  el.classList.remove('pressed','hl');
  f.style.opacity=0;
}
function msg(html,side,btns){
  const m=document.createElement('div');m.className='m '+side;
  m.innerHTML='<div class="b">'+html+'<span class="tm">9:41</span></div>';

    m.appendChild(k);

}

const show=id=>$(id).classList.add('on');

function scrollPg(el,pad){

/* INCY inner scroll */
let curScroll=0;
function iscrollTo(y){curScroll=Math.max(0,y);$('#iscroll').style.transform='translateY(-'+curScroll+'px)'}
function ensureVisible(el){
  const vh=462;
  const need=el.offsetTop+el.offsetHeight-vh+26;
  if(need>curScroll)iscrollTo(need);
}
async function pingTest(){
  const rows=[...document.querySelectorAll('.srv')];
  rows.forEach(r=>{r.querySelector('.v').textContent='…';r.querySelector('.dot').className='dot';r.classList.add('testing')});
  let best=0;
  for(let i=0;i<rows.length;i++){
    await after(.42);
    const ms=SERVERS[i][3],r=rows[i];
    r.querySelector('.v').textContent=ms+'ms';
    r.querySelector('.dot').className='dot '+dotCls(ms);
    r.classList.remove('testing');
    if(ms<SERVERS[best][3])best=i;
    ensureVisible(r);
  }
  return best;
}
